# PitchFinder campaign config — Apodex launch.
# Sources (red-book, verbatim from site): website www.apodex.com / web app www.apodex.ai /
#   API platform.apodex.ai / GitHub github.com/ApodexAI / HuggingFace huggingface.co/apodex.
# Run end-to-end with:  pitchfinder campaign brands/apodex.yaml
brand: apodex

one_liner: "Apodex — Self-Evolving Heavy-Duty Solver. The hardest problems are heavy-duty and have no existing answer; Apodex does the deep research to find one and checks every step so you can trust the result."

positioning: >
  A model that thinks, verifies, and rewrites itself — optimized for being right rather
  than for generating plausible answers. Three pillars: Verified Reasoning (an independent
  agent audits every step), Causal Discovery (actively engages the external world and seeks
  evidence instead of guessing), and Self Evolution (continuous self-improvement loops that
  rewrite its own logic). Built for high-stakes domains where being wrong is not an option:
  scientific research (biomedical, clinical reasoning, materials science, genomics) and
  enterprise (finance and risk, legal and compliance, software engineering). The web app
  (www.apodex.ai) returns verified briefs with step-level reasoning traces and citations,
  not chat replies.

themes:
  - verifiable AI
  - heavy-duty solver
  - AI for science
  - self-evolving AI
  - post-training
  - reinforcement learning from verifiable rewards
  - test-time reasoning
  - theorem proving
  - hallucination-free deep research
  - autonomous agents

competitors:
  - OpenAI o3 research
  - Gemini thinking
  - Kimi k2 thinking
  - Claude Opus 4.8 adaptive
  - axiommath.ai
  - recursive.com

# Red lines — never fabricate these in pitch angles (the launch site lists no
# metrics or customers, so neither do we).
do_not:
  - fabricated benchmark numbers or percentages
  - named customers or logos
  - unverifiable claims

platforms: [substack, blog, podcast, youtube]

discovery:
  providers: [querit, brave]   # Querit 主（合约不限速）、Brave 辅
  per_platform_queries: 4
  apodex_fallback_min: 60
  apodex_model: apodex-1-0-deepresearch-mini

tiering:
  model: anthropic/claude-sonnet-4.6   # judgment task → strong model
  drop_content_farms: true

deepdive:
  tier: A
  top_n: 5
  model: apodex-1-0-deepresearch

budget:
  max_deepdive: 8
