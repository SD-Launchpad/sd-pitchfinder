[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchfinder"
version = "0.1.0"
description = "Internal CLI to find AI/tech creators worth pitching for product launches"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "dnspython>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pitchfinder = "pitchfinder.cli:app"

[tool.setuptools.packages.find]
include = ["pitchfinder*"]
